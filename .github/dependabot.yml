version: 2
updates:
  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: '-'
    groups:
      stable-updates:
        update-types:
          - "major"
          - "minor"
          - "patch"

  # Go dependencies (go.mod + go.sum)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: '-'
    groups:
      stable-updates:
        update-types:
          - "major"
          - "minor"
          - "patch"
