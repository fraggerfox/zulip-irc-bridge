name: PR title

# Enforce a Conventional Commits PR title. We squash-merge, so the PR
# title becomes the commit on main that release-please (CD) parses to
# decide the version bump — this check is what keeps that readable.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
