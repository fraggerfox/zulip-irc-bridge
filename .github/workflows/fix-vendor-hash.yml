name: Fix vendorHash

# Dependabot bumps go.mod/go.sum, which invalidates the fixed-output
# vendorHash in flake.nix. This workflow computes the new hash from
# nix's own mismatch error and pushes a fixup commit to the PR branch.
#
# Push token: uses AUTOFIX_TOKEN (fine-grained PAT, contents:write on
# this repo) when present so the fixup commit retriggers CI — commits
# pushed with the built-in GITHUB_TOKEN do not trigger workflows, which
# would leave the PR blocked on "expected" checks. Without the secret
# it falls back to GITHUB_TOKEN: the fix still lands, but you must
# retrigger CI manually (close/reopen the PR or push an empty commit).
#
# Loop safety: a rerun after the fixup finds the hash already correct
# and exits without pushing.

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.AUTOFIX_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31

      - name: build, capturing the hash mismatch if any
        id: build
        run: |
          set +e
          nix build . 2> build.log
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "hash unchanged, nothing to do"
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          got=$(grep -oP 'got:\s+\Ksha256-\S+' build.log || true)
          if [ -z "$got" ]; then
            echo "::error::nix build failed for a reason other than a hash mismatch:"
            cat build.log
            exit 1
          fi
          echo "new vendorHash: $got"
          sed -i -E "s|vendorHash = \"sha256-[^\"]+\";|vendorHash = \"$got\";|" flake.nix
          echo "fixed=true" >> "$GITHUB_OUTPUT"

      - name: verify the fixed hash builds
        if: steps.build.outputs.fixed == 'true'
        run: nix build .

      - name: commit and push the fixup
        if: steps.build.outputs.fixed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore: update vendorHash for dependency bump"
          git push
